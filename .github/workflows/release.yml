name: release

# Main-driven release (docs/adr/0006, docs/adr/0007). Pushing a version bump to
# main runs the full gate, tags the release commit, then, depending on whether
# the version carries a prerelease identifier, either opens a GitHub prerelease
# with the tarball attached (npm is skipped) or publishes to npm and opens a
# stable Release with the same tarball. A stable body comes from
# docs/releases/v<version>.md; a prerelease page starts from the fixed notice
# in .github/PRERELEASE_BODY.md. Neither uses --generate-notes.
#
# While package.json has `"private": true` the workflow does nothing: the
# package is not released yet, and a stray manifest edit must not publish it.
#
# Every step checks state first, so a partially completed release can be
# re-run: an already-published npm version is skipped, an existing tag or
# Release is not recreated (a stable Release body is edited in place). npm
# publish sits after the tag and before the stable Release: it is the only
# irreversible step.
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write   # push the release tag, create / edit the Release
  id-token: write   # npm provenance / Trusted Publishing

# One release at a time; never cancel one halfway (npm publish is not
# transactional with the tag or Release that follows it).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      # Read what has already happened for this version before running the
      # gate. A version carrying a hyphen (0.2.0-rc.1) is a prerelease:
      # GitHub only, npm never.
      - id: state
        name: Release state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$(node -p "require('./package.json').private === true")" = "true" ]; then
            echo "::notice::package.json is private: nothing to release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NAME=$(node -p "require('./package.json').name")
          V=$(node -p "require('./package.json').version")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tarball=$(node -p "const p = require('./package.json'); p.name.replace(/^@/, '').replace('/', '-') + '-' + p.version + '.tgz'")" >> "$GITHUB_OUTPUT"
          case "$V" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null 2>&1 && echo "tag=done" >> "$GITHUB_OUTPUT" || true
          gh release view "v$V" >/dev/null 2>&1 && echo "gh=done" >> "$GITHUB_OUTPUT" || true
          if [ "${V#*-}" = "$V" ]; then
            npm view "$NAME@$V" version >/dev/null 2>&1 && echo "npm=done" >> "$GITHUB_OUTPUT" || true
          else
            echo "npm=skipped" >> "$GITHUB_OUTPUT"
          fi

      # A missing stable body must fail before the irreversible npm step.
      - id: notes
        name: Release notes
        if: steps.state.outputs.skip != 'true'
        run: |
          set -euo pipefail
          V="${{ steps.state.outputs.version }}"
          if [ "${{ steps.state.outputs.prerelease }}" = "true" ]; then
            FILE="$RUNNER_TEMP/prerelease-notes.md"
            sed -e '/^<!--/,/-->/d' -e "s|<TAG>|v$V|g" -e "s|<VERSION>|$V|g" .github/PRERELEASE_BODY.md > "$FILE"
          else
            FILE="docs/releases/v$V.md"
            if [ ! -f "$FILE" ]; then
              echo "::error::$FILE is missing: write it from .github/RELEASE_TEMPLATE.md and commit it with the version bump"
              exit 1
            fi
          fi
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Gate
        if: steps.state.outputs.skip != 'true' && (steps.state.outputs.npm != 'done' || steps.state.outputs.tag != 'done' || steps.state.outputs.gh != 'done')
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm verify
          pnpm build
          pnpm pack
          mkdir -p pkg && tar -xzf "${{ steps.state.outputs.tarball }}" -C pkg
          node scripts/assert-pack.mjs pkg/package

      - name: Tag
        if: steps.state.outputs.skip != 'true' && steps.state.outputs.tag != 'done'
        run: |
          set -euo pipefail
          V="${{ steps.state.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$V" -m "v$V"
          git push origin "refs/tags/v$V"

      # Trusted publishing (OIDC) wins whenever it is set up: with
      # `id-token: write` the CLI exchanges the OIDC token for a publish token
      # and overrides NPM_TOKEN. The secret is only the fallback for a package
      # that has no trusted publisher yet, which is the case until the first
      # version is on the registry (npm only registers trust for an existing
      # package).
      - name: Publish to npm
        if: steps.state.outputs.skip != 'true' && steps.state.outputs.prerelease != 'true' && steps.state.outputs.npm != 'done'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npm publish "${{ steps.state.outputs.tarball }}" --provenance --access public

      - name: GitHub Release
        if: steps.state.outputs.skip != 'true' && steps.state.outputs.gh != 'done'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="${{ steps.state.outputs.version }}"
          if [ "${{ steps.state.outputs.prerelease }}" = "true" ]; then
            CHANNEL=(--prerelease)
          else
            CHANNEL=(--latest)
          fi
          gh release create "v$V" "${{ steps.state.outputs.tarball }}" \
            --title "v$V" --notes-file "${{ steps.notes.outputs.file }}" --verify-tag "${CHANNEL[@]}"

      # A rerun after the Release exists refreshes a stable body from its file;
      # a prerelease body is written by hand afterwards and is left alone.
      - name: Refresh stable Release notes
        if: steps.state.outputs.skip != 'true' && steps.state.outputs.gh == 'done' && steps.state.outputs.prerelease != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="${{ steps.state.outputs.version }}"
          gh release edit "v$V" --title "v$V" --notes-file "${{ steps.notes.outputs.file }}" --latest
